
services:
  app:
    build: .
    container_name: resource-tracker-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: resource-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: resourcepasword
      MYSQL_DATABASE: resource_tracker
      MYSQL_USER: resource_user
      MYSQL_PASSWORD: resourcepassword
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-presourcepassword"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  mysql_data:
