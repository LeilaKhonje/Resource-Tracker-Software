services:
  app:
    build: .
    container_name: resource-tracker-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - resource-tracker

  mysql:
    image: mysql:8.4
    container_name: resource-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: resourcepassword
      MYSQL_DATABASE: resource_tracker
      MYSQL_USER: resource_user
      MYSQL_PASSWORD: resourcepassword
    ports:
      - "3306:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-presourcepassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      resource-tracker:
        aliases:
          - mysql

networks:
  resource-tracker:
    driver: bridge

volumes:
  mysql_data:
