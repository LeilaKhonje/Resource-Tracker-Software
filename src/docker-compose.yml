services:
  app:
    build: .
    container_name: resource-tracker-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: resource-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: resourcepassword
      MYSQL_DATABASE: resource_tracker
      MYSQL_USER: resource_user
      MYSQL_PASSWORD: resourcepassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  mysql_data:
